databaseChangeLog:
  - changeSet:
      id: 001-create-user-account-table
      author: pisethjavaschool
      changes:
        - createTable:
            tableName: user_account
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: keycloak_user_id
                  type: varchar(80)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: user_type
                  type: varchar(40)
                  constraints:
                    nullable: false
              - column:
                  name: country_code
                  type: varchar(10)
              - column:
                  name: phone_number
                  type: varchar(30)
              - column:
                  name: email
                  type: varchar(150)
              - column:
                  name: username
                  type: varchar(180)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: account_status
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: registration_status
                  type: varchar(40)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: uuid
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: uuid
        - createIndex:
            tableName: user_account
            indexName: idx_user_account_user_type
            columns:
              - column:
                  name: user_type
        - createIndex:
            tableName: user_account
            indexName: idx_user_account_email
            columns:
              - column:
                  name: email
